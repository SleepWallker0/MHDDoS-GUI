[package]
name = "mhddos_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "mhddos_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "socks", "stream"] }
socket2 = "0.5"
rand = "0.8"
futures-util = "0.3"
bytes = "1.0"
